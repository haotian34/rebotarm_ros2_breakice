# Keep build artifacts in the workspace: symlink-install environment hooks
# reference these files, so they must survive temporary-directory cleanup.
# Use an ASCII-only workspace path with ROS Jazzy rosidl_adapter.
build:
  build-base: build
  cmake-args:
    - -DCMAKE_DISABLE_FIND_PACKAGE_Qt6=TRUE
    - -DPython3_EXECUTABLE=/usr/bin/python3
    - -DPYTHON_EXECUTABLE=/usr/bin/python3
